<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <form id="dateForm" class="filters">
      <label for="startDate">Start date</label>
      <input type="date" id="startDate" required />
      <label for="endDate">End date</label>
      <input type="date" id="endDate" required />
      <button type="submit">Get Space Images</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>

    <dialog id="imageModal" class="image-modal" aria-labelledby="modalTitle" aria-describedby="modalExplanation">
      <button type="button" id="closeModal" class="modal-close" aria-label="Close image details" autofocus>
        &times;
      </button>
      <img id="modalImage" class="modal-image" alt="" />
      <h2 id="modalTitle"></h2>
      <p id="modalDate" class="modal-date"></p>
      <p id="modalExplanation"></p>
    </dialog>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
